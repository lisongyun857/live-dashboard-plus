<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>管理面板 · Live Dashboard</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fff5f8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-page="admin">
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>管理面板</h1>
          <p class="brand-sub">站点 · 设备 · 数据 · 安全</p>
        </div>
      </div>
      <div class="header-meta">
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深浅色">
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 13.5A9 9 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5Z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
        <a class="ghost-btn" href="/">返回面板</a>
      </div>
    </div>
  </header>

  <main class="page admin-page">
    <!-- 登录 -->
    <section class="card admin-login" id="login-view">
      <h2>管理员登录</h2>
      <p class="admin-muted">密码在第一次启动服务时自动生成并打印在控制台，也可在 config.json 的 admin_password 查看。</p>
      <form id="login-form" autocomplete="off">
        <label class="field">
          <span>管理密码</span>
          <input class="admin-input" id="login-password" type="password" placeholder="输入管理密码" required>
        </label>
        <button class="admin-btn primary" type="submit">登录</button>
      </form>
      <p class="admin-msg" id="login-msg"></p>
      <p class="admin-warn" id="insecure-warn" hidden>当前通过 HTTP 明文访问，密码可能被窃听。建议先给服务器配置 HTTPS（见接入指南的部署章节）。</p>
    </section>

    <!-- 面板主体 -->
    <div id="panel-view" hidden>
      <section class="card admin-card">
        <div class="section-head">
          <h2>站点设置</h2>
          <span class="section-note" id="stat-line"></span>
        </div>
        <div class="admin-grid">
          <label class="field">
            <span>站点名称</span>
            <input class="admin-input" id="set-name" maxlength="64">
          </label>
          <label class="field">
            <span>站点描述</span>
            <input class="admin-input" id="set-desc" maxlength="128">
          </label>
          <label class="field">
            <span>离线判定（秒）</span>
            <input class="admin-input" id="set-offline" type="number" min="10" max="3600">
          </label>
          <label class="field">
            <span>记录保留（天）</span>
            <input class="admin-input" id="set-retention" type="number" min="1" max="365">
          </label>
        </div>
        <div class="admin-actions">
          <button class="admin-btn primary" id="save-settings" type="button">保存设置</button>
          <span class="admin-msg" id="settings-msg"></span>
        </div>
      </section>

      <section class="card admin-card">
        <div class="section-head">
          <h2>设备管理</h2>
          <span class="section-note">令牌即设备上报凭据，泄露后请立即重新生成</span>
        </div>
        <div class="admin-inline-form">
          <input class="admin-input" id="new-device-name" placeholder="设备名称，如：我的笔记本" maxlength="32">
          <select class="admin-select" id="new-device-platform">
            <option value="windows">Windows</option>
            <option value="android">Android</option>
            <option value="macos">macOS</option>
            <option value="linux">Linux</option>
            <option value="ios">iOS</option>
          </select>
          <button class="admin-btn" id="add-device" type="button">添加设备</button>
        </div>
        <p class="admin-msg" id="device-msg"></p>
        <div class="device-admin-list" id="device-list"></div>
      </section>

      <section class="card admin-card">
        <div class="section-head">
          <h2>数据管理</h2>
          <span class="section-note" id="data-stats"></span>
        </div>
        <div class="admin-actions">
          <button class="admin-btn danger" id="clear-all" type="button">清空全部历史记录</button>
          <span class="admin-msg" id="data-msg"></span>
        </div>
      </section>

      <section class="card admin-card">
        <div class="section-head">
          <h2>修改管理密码</h2>
          <span class="section-note">修改后其他已登录会话将失效</span>
        </div>
        <div class="admin-inline-form">
          <input class="admin-input" id="new-password" type="password" placeholder="新密码（至少 6 位）" maxlength="128">
          <button class="admin-btn" id="save-password" type="button">保存新密码</button>
        </div>
        <p class="admin-msg" id="password-msg"></p>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <span>Live Dashboard 管理面板</span>
    <span class="footer-links">
      <a href="/">查看仪表盘</a>
      <a href="/guide">接入指南</a>
    </span>
  </footer>

  <script src="/admin.js"></script>
</body>
</html>
