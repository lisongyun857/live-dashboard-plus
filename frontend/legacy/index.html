<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Live Dashboard</title>
  <meta name="description" content="实时设备活动仪表盘：电脑与手机同屏查看">
  <meta name="theme-color" content="#fff5f8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="petals" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="13" height="10" rx="2"/>
            <rect x="17" y="10" width="4" height="10" rx="1.5"/>
            <path d="M3 17h13"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 id="site-name">Live Dashboard</h1>
          <p class="brand-sub" id="site-desc">此刻，我正在做什么</p>
        </div>
      </div>
      <div class="header-meta">
        <span class="live-badge"><i></i>LIVE</span>
        <span class="viewer-count"><b id="viewer-count">0</b> 人围观</span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深浅色">
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 13.5A9 9 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5Z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
        <a class="ghost-btn" href="/guide">手机接入</a>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="hero card" id="hero" aria-live="polite">
      <div class="hero-main">
        <p class="hero-kicker">此刻</p>
        <h2 class="hero-title" id="hero-title">等待第一次上报…</h2>
        <p class="hero-status" id="hero-status">把电脑或手机接上，就能看到实时动态喵~</p>
        <p class="hero-detail" id="hero-detail"></p>
      </div>
      <div class="hero-side">
        <div class="hero-device" id="hero-device"></div>
        <div class="hero-updated mono" id="hero-updated"></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>设备同屏</h2>
        <span class="section-note" id="device-summary"></span>
      </div>
      <div class="device-grid" id="device-grid"></div>
    </section>

    <section class="card timeline-card">
      <div class="section-head">
        <h2>今日轨迹</h2>
        <div class="timeline-controls">
          <div class="device-tabs" id="device-tabs" role="tablist"></div>
          <input class="date-input" id="date-input" type="date" aria-label="选择日期">
        </div>
      </div>
      <div class="timeline-rows" id="timeline-rows"></div>
      <div class="timeline-foot">
        <span class="timeline-hint">— 每段颜色代表一个应用，悬停查看时长</span>
        <span class="timeline-total mono" id="timeline-total"></span>
      </div>
    </section>

    <section class="card recent-card">
      <div class="section-head">
        <h2>最近动态</h2>
        <span class="section-note">跨设备汇总</span>
      </div>
      <ol class="recent-list" id="recent-list"></ol>
    </section>
  </main>

  <footer class="site-footer">
    <span>Live Dashboard · 电脑与手机同屏围观</span>
    <span class="footer-links">
      <a href="/guide">接入指南</a>
      <a href="/admin">管理面板</a>
      <a href="/api/current" target="_blank" rel="noreferrer">API</a>
    </span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
